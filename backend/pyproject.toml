[project]
name = "retro-janken-backend"
version = "0.1.0"
description = "Image classification API for retro_janken"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "pillow>=10.4,<13",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
]
ml = [
    "tensorflow>=2.16,<3",
    "tensorflow-datasets>=4.9,<5",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["rps"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
